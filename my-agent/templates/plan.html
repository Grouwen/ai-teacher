{% extends "base.html" %}
{% block title %}章节规划 · AI教学员{% endblock %}
{% block content %}
<header class="page-head split">
  <div class="page-head-main">
    <h1>你的学习路线</h1>
  </div>
  <div class="head-meta" id="plan-meta">生成中…</div>
</header>

<div id="plan-list" class="plan-list" aria-busy="true"></div>

<div class="action-bar hidden">
  <div class="action-buttons">
    <button id="plan-regen" class="btn btn-ghost" type="button">重新生成</button>
    <button id="plan-confirm" class="btn btn-primary" type="button">
      确认规划 <span class="btn-arrow" aria-hidden="true">→</span>
    </button>
  </div>
</div>
{% endblock %}
