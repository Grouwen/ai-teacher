{% extends "base.html" %}
{% block title %}学习进度 · AI教学员{% endblock %}
{% block content %}
<header class="page-head">
  <div class="page-head-main">
    <h1>学习进度</h1>
  </div>
</header>

<div id="progress-body" class="progress-body" aria-busy="true"></div>

<div class="action-bar hidden">
  <div class="action-buttons">
    <button id="btn-continue" class="btn btn-primary" type="button">
      继续学习 <span class="btn-arrow" aria-hidden="true">→</span>
    </button>
  </div>
</div>

<section class="danger-zone">
  <div class="danger-copy">
    <h2>重置全部进度</h2>
    <p>会清空摸底、规划与进度。答题记录仍保留在 <code>data/answers.jsonl</code>。</p>
  </div>
  <button id="btn-reset" class="btn btn-danger" type="button">重置进度</button>
</section>
{% endblock %}
